<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Job Log</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:19px;background:#f3f5f9;color:#1d2433}
header{background:#1f4e79;color:#fff;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:28px}main{max-width:1100px;margin:auto;padding:16px}
button,select,input,textarea{font-size:19px;font-family:inherit}
button{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#e3e9f2;color:#1d2433}
.primary{background:#2e7d32;color:#fff;font-weight:700}.danger{background:#c62828;color:#fff}
.months{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.months button{flex:1 0 70px;padding:12px 6px}
.months button.on{background:#1f4e79;color:#fff;font-weight:700}.months button .n{display:block;font-size:13px;opacity:.8}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px #0002}
.big{font-size:36px;font-weight:800;color:#1f4e79}.lbl{color:#5a6475}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal div{aspect-ratio:1.4;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px}
.cal .h{background:none;font-weight:700;aspect-ratio:auto}.cal small{font-size:12px;font-weight:700}
.day h3{margin:22px 0 8px;color:#1f4e79}.entry{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wo{font-weight:800;font-size:21px}.loc{color:#2e5d8a;font-weight:600}.desc{white-space:pre-wrap;margin-top:6px}
.tag{background:#fff3cd;color:#7a5a00;border-radius:6px;padding:2px 8px;font-size:14px;margin-left:6px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}#search{flex:1;min-width:200px;padding:12px;border:2px solid #c5cfdd;border-radius:10px}
dialog{border:0;border-radius:16px;width:min(560px,95vw);padding:22px}dialog label{display:block;font-weight:700;margin-top:12px}
dialog input,dialog textarea{width:100%;padding:12px;border:2px solid #c5cfdd;border-radius:10px;margin-top:4px}
.banner{background:#e8f4fd;border:2px dashed #1f4e79;border-radius:14px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.empty{text-align:center;color:#5a6475;padding:30px}
</style><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Job Log"><meta name="theme-color" content="#2e7d32"></head><body>
<header><h1>📋 My Job Log</h1><div style="display:flex;gap:8px;flex-wrap:wrap">
<select id="year" aria-label="Year"></select>
<button id="exportBtn">⬇ Export</button><button id="importBtn">⬆ Import</button><input type="file" id="file" accept=".json" hidden></div></header>
<main>
<div id="banner" class="banner" hidden><span>New here? Try it with <b>example entries</b> (marked "SAMPLE").</span>
<span><button class="primary" id="sampleBtn">Load sample data</button> <button id="dismiss">No thanks ✕</button></span></div>
<div class="months" id="months"></div>
<div class="bar"><button class="primary" id="addBtn" style="font-size:22px">＋ Add job</button><input id="search" type="search" placeholder="🔍 Search work order, location, or work done…"></div>
<div id="summary" class="cards"></div>
<div class="card" style="margin-top:12px"><b>Jobs per day</b><div id="cal" class="cal" style="margin-top:8px"></div></div>
<div id="list"></div>
</main>
<dialog id="dlg"><form method="dialog" id="form"><h2 id="ftitle" style="margin:0">Add job</h2>
<label>Date<input type="date" id="fdate" required></label>
<label>Work order #<input id="fwo" required></label>
<label>Job location<input id="floc" required></label>
<label>Work done<textarea id="fdesc" rows="5" required></textarea></label>
<div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save job</button></div></form></dialog>
<script>
const KEY='jobLog.v1',MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let jobs=JSON.parse(localStorage.getItem(KEY)||'[]'),now=new Date(),year=now.getFullYear(),month=now.getMonth(),editId=null;
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(jobs));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function years(){const ys=new Set([2026,now.getFullYear(),year,...jobs.map(j=>+j.date.slice(0,4))]);$('year').innerHTML=[...ys].sort().map(y=>`<option ${y==year?'selected':''}>${y}</option>`).join('')}
function render(){years();const q=$('search').value.trim().toLowerCase();
$('banner').hidden=!!(jobs.length||localStorage.getItem(KEY+'.noSample'));
$('months').innerHTML=MN.map((m,i)=>{const n=jobs.filter(j=>j.date.startsWith(`${year}-${String(i+1).padStart(2,'0')}`)).length;return `<button class="${i==month?'on':''}" data-m="${i}">${m}<span class="n">${n} job${n==1?'':'s'}</span></button>`}).join('');
const pre=`${year}-${String(month+1).padStart(2,'0')}`;let mj=jobs.filter(j=>j.date.startsWith(pre));
const per={};mj.forEach(j=>per[j.date]=(per[j.date]||0)+1);const busy=Object.entries(per).sort((a,b)=>b[1]-a[1])[0];
$('summary').innerHTML=`<div class="card"><div class="big">${mj.length}</div><div class="lbl">Jobs in ${MN[month]} ${year}</div></div>
<div class="card"><div class="big">${new Set(mj.map(j=>j.loc.trim().toLowerCase())).size}</div><div class="lbl">Different locations</div></div>
<div class="card"><div class="big">${busy?new Date(busy[0]+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—'}</div><div class="lbl">Busiest day${busy?` (${busy[1]} job${busy[1]>1?"s":""})`:''}</div></div>`;
const first=new Date(year,month,1).getDay(),dim=new Date(year,month+1,0).getDate(),mx=Math.max(1,...Object.values(per));
let c='SMTWTFS'.split('').map(d=>`<div class="h">${d}</div>`).join('')+'<div></div>'.repeat(first);
for(let d=1;d<=dim;d++){const n=per[`${pre}-${String(d).padStart(2,'0')}`]||0,a=n?0.25+0.75*n/mx:0;
c+=`<div title="${n} jobs" style="background:${n?`rgba(46,125,50,${a})`:'#eef1f6'};color:${a>.6?'#fff':'#1d2433'}">${d}${n?`<small>${n} job${n>1?'s':''}</small>`:''}</div>`}
$('cal').innerHTML=c;
let shown=q?jobs.filter(j=>(j.wo+' '+j.loc+' '+j.desc+' '+j.date).toLowerCase().includes(q)):mj;
shown=[...shown].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
if(!shown.length){$('list').innerHTML=`<div class="empty">${q?'No jobs match your search.':'No jobs logged this month yet. Tap <b>＋ Add job</b> to start.'}</div>`;return}
let h=q?`<h3 style="margin-top:20px">Search results (all months): ${shown.length}</h3>`:'',last='';
shown.forEach(j=>{if(j.date!=last){last=j.date;h+=`<div class="day"><h3>${new Date(j.date+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h3></div>`}
h+=`<div class="card entry" style="margin-bottom:10px"><div style="flex:1;min-width:220px"><div class="wo">WO #${esc(j.wo)}${j.sample?'<span class="tag">SAMPLE</span>':''}</div><div class="loc">📍 ${esc(j.loc)}</div><div class="desc">${esc(j.desc)}</div></div>
<div style="display:flex;gap:8px;align-items:start"><button data-e="${j.id}">✏ Edit</button><button class="danger" data-d="${j.id}">🗑 Delete</button></div></div>`});
$('list').innerHTML=h}
function openForm(j){editId=j?j.id:null;$('ftitle').textContent=j?'Edit job':'Add job';
const td=new Date(),def=(year==td.getFullYear()&&month==td.getMonth())?td.toISOString().slice(0,10):`${year}-${String(month+1).padStart(2,'0')}-01`;
$('fdate').value=j?j.date:def;$('fwo').value=j?j.wo:'';$('floc').value=j?j.loc:'';$('fdesc').value=j?j.desc:'';$('dlg').showModal()}
$('form').onsubmit=()=>{const d={date:$('fdate').value,wo:$('fwo').value.trim(),loc:$('floc').value.trim(),desc:$('fdesc').value.trim()};
if(editId){Object.assign(jobs.find(x=>x.id==editId),d)}else jobs.push({id:Date.now(),...d});
year=+d.date.slice(0,4);month=+d.date.slice(5,7)-1;save();render()};
$('cancel').onclick=()=>$('dlg').close();$('addBtn').onclick=()=>openForm();
$('months').onclick=e=>{const b=e.target.closest('button');if(b){month=+b.dataset.m;$('search').value='';render()}};
$('year').onchange=e=>{year=+e.target.value;render()};$('search').oninput=render;
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.e)openForm(jobs.find(j=>j.id==b.dataset.e));
if(b.dataset.d&&confirm('Delete this job? This cannot be undone.')){jobs=jobs.filter(j=>j.id!=b.dataset.d);save();render()}};
$('dismiss').onclick=()=>{localStorage.setItem(KEY+'.noSample',1);render()};
$('sampleBtn').onclick=()=>{const p=`${year}-${String(month+1).padStart(2,'0')}-`,s=[[3,'SAMPLE-1001','123 Example St (sample)','Replaced faucet cartridge. Tested for leaks.'],[3,'SAMPLE-1002','Example Office Park, Unit 4 (sample)','Inspected HVAC unit, changed filter.'],[8,'SAMPLE-1003','45 Demo Ave (sample)','Installed 3 new outlets in garage.'],[12,'SAMPLE-1004','123 Example St (sample)','Follow-up visit, no issues found.'],[15,'SAMPLE-1005','Sample Plaza (sample)','Patched drywall and painted.']];
s.forEach((x,i)=>jobs.push({id:Date.now()+i,date:p+String(x[0]).padStart(2,'0'),wo:x[1],loc:x[2],desc:x[3],sample:true}));save();render()};
$('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(jobs,null,2)],{type:'application/json'}));a.download=`job-log-backup-${new Date().toISOString().slice(0,10)}.json`;a.click()};
$('importBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d))throw 0;
const rep=confirm(`Found ${d.length} jobs.\nOK = replace current data\nCancel = add to current data`);
jobs=rep?d:jobs.concat(d.filter(x=>!jobs.some(j=>j.id==x.id)));save();render();alert('Import done.')}catch{alert('That file is not a valid job log backup.')}});e.target.value=''};
render();
if(location.hash=='#selftest'){openForm();$('fdate').value='2026-10-20';$('fwo').value='WO-5521';$('floc').value='88 Main St, Poughkeepsie';$('fdesc').value='Test entry from automated check.';$('form').requestSubmit();$('dlg').close();
document.querySelector('[data-m="9"]').click();document.title='OK '+jobs.length+' '+document.querySelectorAll('.entry').length}
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script></body></html>
